name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur une PR annule le run précédent, encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` échoue si package-lock.json et package.json divergent :
      # c'est justement ce qui rendait l'installation impossible à froid.
      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
